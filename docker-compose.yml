version: '3.8'

services:
  solana-dapp:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SOLANA_RPC=${NEXT_PUBLIC_SOLANA_RPC:-https://api.devnet.solana.com}
      - NEXT_PUBLIC_ADMIN_PUBLIC_KEY=${NEXT_PUBLIC_ADMIN_PUBLIC_KEY}
      - NEXT_PUBLIC_INTERACTION_WALLET_PRIVATE_KEY=${NEXT_PUBLIC_INTERACTION_WALLET_PRIVATE_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./logs:/app/logs
    networks:
      - solana-network

networks:
  solana-network:
    driver: bridge
